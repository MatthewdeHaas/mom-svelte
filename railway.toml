[build]
builder = "nixpacks"

[deploy]
# Track 4a: `/` returns 200 even when the DB is down; `/healthz`
# runs a 500ms `SELECT 1` and 503s on failure. See
# src/routes/healthz/+server.ts. `/healthz/deep` is deliberately
# NOT the probe target — coupling liveness to the Rust service
# would cause cascading restarts whenever Rust cycles.
healthcheckPath = "/healthz"
healthcheckTimeout = 120
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 10
