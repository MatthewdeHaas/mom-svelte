# Railway service config for `Rust-API`.
#
# The image is pulled from GHCR, not built on Railway. See
# `.github/workflows/ci.yaml::build-rust-image` for the publish job
# and `.github/workflows/deploy.yaml` for the redeploy trigger.
#
# NOTE: Railway's dashboard "Source" setting must be set to
# `ghcr.io/matthewdehaas/mom-rust-api:latest` for this file to take
# effect. Without that flip, Railway falls back to building the local
# Dockerfile — which produced the toolchain-drift class of bugs
# (sqlx offline-cache mismatches) that this migration eliminates.

[deploy]
# Rust `/healthz` runs a 500ms DB ping (see
# admin-operations-rust/crates/api/src/health.rs). Mirrors the
# SvelteKit side so Railway's probe semantics are identical for
# both services.
healthcheckPath = "/healthz"
healthcheckTimeout = 120
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 10
