[package]
name = "api"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "api"
path = "src/lib.rs"

[[bin]]
name = "api"
path = "src/main.rs"

[dependencies]
# Local
domain = { path = "../domain" }
db     = { path = "../db" }
flags  = { path = "../flags" }
excel  = { path = "../excel" }
pdf    = { path = "../pdf" }

# HTTP + async
tokio.workspace = true
axum.workspace = true
tower.workspace = true
tower-http.workspace = true

# Serde
serde.workspace = true
serde_json.workspace = true

# Types
uuid.workspace = true
chrono.workspace = true

# Logging
tracing.workspace = true
tracing-subscriber.workspace = true

# DB (just for the pool type on AppState)
sqlx.workspace = true

# Auth: HMAC-SHA256 + nonce cache
hmac.workspace = true
sha2.workspace = true
subtle.workspace = true
hex.workspace = true
dashmap.workspace = true

# Errors
thiserror.workspace = true
anyhow.workspace = true

# Exports: packing-slip handler base64-encodes PDF bytes for the JSON
# response envelope so the SvelteKit route can zip the pre-rendered
# PDFs server-side without touching binary over the wire.
base64 = "0.22"

[dev-dependencies]
# Integration tests boot the live router against a bound TcpListener and
# POST multipart from a real HTTP client; reqwest handles the multipart
# boundary and keep-alive. tokio needs full features so the test harness
# can spawn + sleep + handle TcpListener easily.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "multipart", "stream"] }
tokio   = { version = "1.40", features = ["full"] }
# Harness pulls parse_workbook to extract Customer/Recipe names from
# the fixture before seeding.
excel   = { path = "../excel" }
# For uuid::Uuid::new_v4() when minting seeded user ids.
uuid.workspace = true
rand.workspace = true
# Recipe-import integration tests build .xlsx fixtures in-memory so the
# round-trip (bytes → multipart → calamine → parser) stays byte-identical
# to a user-authored upload. Mirrors `crates/excel`'s own test deps.
# (`db` + `domain` already come in via `[dependencies]` above.)
rust_xlsxwriter.workspace = true
# Harness installs a tracing subscriber so handler-side error logs land
# in captured test output (without one, 500s look opaque).
tracing-subscriber.workspace = true
