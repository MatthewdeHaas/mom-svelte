[package]
name = "excel"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# Workspace-internal
domain = { path = "../domain" }
db     = { path = "../db" }

# Excel parse / export
calamine.workspace = true
rust_xlsxwriter.workspace = true

# ZIP post-processing — `pin_xlsx_bytes` rewrites every entry with a
# fixed epoch mtime and scrubs the "Unknown" strings `rust_xlsxwriter`
# leaves in docProps/core.xml, so two runs over the same semantic data
# produce byte-identical xlsx output. Ports `src/lib/excel/determinism.ts`.
zip.workspace = true

# Serde + validation
serde.workspace = true
serde_json.workspace = true
validator.workspace = true

# Types
uuid.workspace = true
chrono.workspace = true

# DB — the orchestrator looks up companies/recipes and starts the
# insert transaction, so it needs the pool type directly.
sqlx.workspace = true

# Pattern matching on cells (regex is kept small — single pass for the
# "#N of M" boilerplate marker and ISO date regex).
regex = "1"

# Static tables (meal canonical map, header column map, boilerplate
# tokens) built once at startup.
once_cell = "1"

# Insertion-order-preserving map for the shopping-list ingredient
# aggregator. HashMap iteration order is nondeterministic — matters
# for byte-identical export; see export/shopping_list.rs module docs.
indexmap = "2"

# Logging
tracing.workspace = true
thiserror.workspace = true

[dev-dependencies]
# Round-trip tests exercise the parser against on-disk xlsx fixtures
# shipped with the SvelteKit repo.
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

# Property tests for the importer — `tests/import_proptest.rs` sweeps
# the parse → analyse → stop → mismatch → normalise → validate →
# resolve pipeline with randomly-generated workbooks. Pure synchronous
# (targets `plan_import_pure` with a HashMap resolver), so no sqlx
# dev-dep required here.
proptest.workspace = true
