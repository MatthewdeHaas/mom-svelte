name: Deploy

# Two-service Railway deploy. Triggered after Release (which publishes
# GHCR images on main-push) succeeds.
#
# How this works post-GHCR migration:
#   1. CI (`ci.yaml`, PR-only) builds + verifies both services on PRs.
#   2. On push to main (after merge), `release.yaml`'s build-rust-image
#      and build-svelte-image jobs push `:latest` + `:<sha>` to GHCR.
#   3. This workflow fires on the completed Release run. It then:
#      a. Queries Railway's GraphQL API with the project-scoped token
#         to resolve the service ID and verify / force-set the
#         service's source to the GHCR image URL. This bypasses
#         Railway's dashboard-state entirely — the mutation is the
#         source of truth for what gets pulled.
#      b. Calls `railway redeploy` to trigger the actual swap.
#
# Why force-set source via GraphQL on every deploy:
#   Railway's dashboard-only wiring kept failing with "unable to
#   connect to the registry" even after the Source field was manually
#   flipped to the ghcr.io URL and the GHCR package was verified
#   public (anonymous Bearer-token manifest fetch works). The
#   hypothesis was that the dashboard save wasn't persisting the
#   source config, OR Railway's pull-cache held a stale credential
#   reference from the pre-flip Dockerfile source. Calling
#   `serviceInstanceUpdate` with the image URL on every deploy makes
#   the source config idempotent — the YAML in this repo is now the
#   source of truth, and dashboard drift can't accumulate.
#
# No `railway up` / build-from-source anywhere in prod. The exact
# binary CI verified is the one that runs. Rollback = push a revert
# PR (CI republishes :latest from the reverted commit).
#
# Required GitHub secrets:
#   - RAILWAY_TOKEN  project-scoped Railway token (v4 CLI format).
#                    The token identifies both the project and the
#                    environment it was minted for — the GraphQL step
#                    uses `projectToken` to self-resolve those.

on:
  workflow_run:
    workflows: ["Release"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy ${{ matrix.service }}
    runs-on: ubuntu-latest
    # Only run on successful Release completions, OR manual dispatch.
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    strategy:
      fail-fast: false
      matrix:
        include:
          - service: mom-svelte
            image_repo: ghcr.io/matthewdehaas/mom-svelte
          - service: Rust-API
            image_repo: ghcr.io/matthewdehaas/mom-rust-api
    # Pin to the exact commit SHA that CI just built, not `:latest`.
    # `:latest` is a moving tag — if we trigger a redeploy an hour
    # later, Railway can pull a different image than the one CI
    # verified. Pinning to `:${sha}` makes rollbacks reproducible
    # (revert PR → CI republishes :${revert_sha} → Deploy pins to it)
    # and makes "which image is this deployment?" answerable from the
    # workflow log alone.
    #
    # Source of the SHA:
    #   - workflow_run trigger: `github.event.workflow_run.head_sha`
    #     is the commit Release just ran against (the one
    #     build-rust-image tagged as :${sha}).
    #   - workflow_dispatch: fall back to `github.sha` (the ref the
    #     manual run was dispatched against). Note: manual re-deploys
    #     of an older commit need that older commit's :${sha} tag to
    #     still exist in GHCR — retention is `min-versions-to-keep: 10`
    #     on the publish side, so the last 10 pushes are always
    #     reachable.
    env:
      IMAGE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

    steps:
      - name: Install Railway CLI
        # Pin v4 — v3.23.0 silently rejects the current project-token
        # format Railway's dashboard mints, returning `Unauthorized`
        # from `railway whoami` with no useful error. v4 accepts the
        # same `RAILWAY_TOKEN` env var and supports `redeploy`.
        run: npm install -g @railway/cli@4

      # Resolve the service ID for this matrix entry via Railway's
      # GraphQL API. The project token self-identifies project +
      # environment; we query the project's service list and match
      # by `name`. Two outputs: `service_id` + `environment_id`.
      #
      # Auth header is `Project-Access-Token`, NOT `Authorization: Bearer`.
      # Railway's GraphQL endpoint distinguishes token flavors by header:
      # Bearer is for account tokens; project tokens use their own header
      # name. Sending Bearer with a project token resolves to no project
      # context and `projectToken` returns "Project Token not found"
      # (verified in probe commit d27e90f4). The CLI uses the same
      # Project-Access-Token header internally, which is why `railway
      # redeploy` works with the same RAILWAY_TOKEN that fails under
      # Bearer.
      #
      # Never echo RAILWAY_TOKEN — pass it only via header env, no
      # `set -x`, mask any accidental payload leakage with jq -r.
      - name: Resolve Railway service + environment IDs
        id: resolve
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          SERVICE_NAME: ${{ matrix.service }}
        run: |
          set -euo pipefail
          query='{"query":"{ projectToken { projectId environmentId project { services { edges { node { id name } } } } } }"}'
          resp=$(curl -sS -X POST https://backboard.railway.com/graphql/v2 \
            -H "Project-Access-Token: $RAILWAY_TOKEN" \
            -H "Content-Type: application/json" \
            -d "$query")
          # Fail loudly if the response has `errors` — don't let a
          # downstream mutation run against a null service_id.
          if echo "$resp" | jq -e '.errors' >/dev/null 2>&1; then
            echo "GraphQL error resolving project token:"
            echo "$resp" | jq '.errors'
            exit 1
          fi
          env_id=$(echo "$resp" | jq -r '.data.projectToken.environmentId')
          svc_id=$(echo "$resp" | jq -r --arg name "$SERVICE_NAME" \
            '.data.projectToken.project.services.edges[] | select(.node.name == $name) | .node.id')
          if [ -z "$svc_id" ] || [ "$svc_id" = "null" ]; then
            echo "Could not resolve service id for name=$SERVICE_NAME"
            echo "Available services:"
            echo "$resp" | jq -r '.data.projectToken.project.services.edges[].node.name'
            exit 1
          fi
          echo "service_id=$svc_id" >> "$GITHUB_OUTPUT"
          echo "environment_id=$env_id" >> "$GITHUB_OUTPUT"
          echo "Resolved $SERVICE_NAME -> service_id=$svc_id env_id=$env_id"

      # Introspect current source state. This step is diagnostic —
      # if we're already pointed at the right GHCR image, the next
      # mutation is a no-op; if the source is still a Dockerfile or
      # a stale image URL, this surfaces that in the log so the next
      # Deploy run has an audit trail.
      #
      # Query must traverse through `projectToken.project.services` —
      # project tokens can't call `service(id:)` at the root (returns
      # null, not an error). Filter by service id in jq to pull just
      # the one we care about.
      #
      # `set +e` on jq so introspection failure doesn't skip the
      # mutation below (the mutation is the actual fix; this step is
      # diagnostic only).
      - name: Inspect current service source
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          SERVICE_ID: ${{ steps.resolve.outputs.service_id }}
        run: |
          set -uo pipefail
          query='{"query":"{ projectToken { project { services { edges { node { id name serviceInstances { edges { node { environmentId source { image repo } } } } } } } } } }"}'
          resp=$(curl -sS -X POST https://backboard.railway.com/graphql/v2 \
            -H "Project-Access-Token: $RAILWAY_TOKEN" \
            -H "Content-Type: application/json" \
            -d "$query")
          if echo "$resp" | jq -e '.errors' >/dev/null 2>&1; then
            echo "Note: introspection returned errors (continuing anyway):"
            echo "$resp" | jq '.errors' || true
          else
            echo "Current source for service $SERVICE_ID:"
            echo "$resp" | jq --arg sid "$SERVICE_ID" \
              '.data.projectToken.project.services.edges[].node
               | select(.id == $sid)
               | {name, instances: [.serviceInstances.edges[].node | {environmentId, source}]}' \
              || echo "(jq filter failed — payload above)"
          fi
          # Always return 0; this step is diagnostic.
          exit 0

      # Force-set the service source to the GHCR image URL. Idempotent:
      # if the source is already correct this is a no-op; if dashboard
      # drift happened or the source still points at a Dockerfile, this
      # fixes it before the redeploy fires.
      - name: Force-set service source to GHCR image
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          SERVICE_ID: ${{ steps.resolve.outputs.service_id }}
          ENV_ID: ${{ steps.resolve.outputs.environment_id }}
          IMAGE: ${{ matrix.image_repo }}:${{ env.IMAGE_SHA }}
        run: |
          set -euo pipefail
          mutation=$(jq -nc --arg sid "$SERVICE_ID" --arg eid "$ENV_ID" --arg img "$IMAGE" \
            '{query: "mutation($sid: String!, $eid: String!, $img: String!) { serviceInstanceUpdate(serviceId: $sid, environmentId: $eid, input: { source: { image: $img } }) }", variables: {sid: $sid, eid: $eid, img: $img}}')
          resp=$(curl -sS -X POST https://backboard.railway.com/graphql/v2 \
            -H "Project-Access-Token: $RAILWAY_TOKEN" \
            -H "Content-Type: application/json" \
            -d "$mutation")
          if echo "$resp" | jq -e '.errors' >/dev/null 2>&1; then
            echo "serviceInstanceUpdate failed:"
            echo "$resp" | jq '.errors'
            exit 1
          fi
          echo "Source set to $IMAGE for service $SERVICE_ID"

      # Trigger a fresh deployment using the source config we just
      # wrote above.
      #
      # Why `serviceInstanceDeployV2` instead of `railway redeploy`:
      #   `railway redeploy` replays the *last deployment record*.
      #   After `serviceInstanceUpdate` changes the source, that old
      #   record is marked "removed" (Railway's model: the previous
      #   deployment was built from a different source, so it's not
      #   the same deployment anymore). `redeploy` then errors with
      #   "The latest deployment for service X cannot be redeployed.
      #   This may be because it's currently building, deploying, or
      #   was removed." — exactly what we saw in run 38678378297.
      #
      #   `serviceInstanceDeployV2(serviceId, environmentId)` creates
      #   a *new* deployment from the current source config. It's
      #   what the dashboard "Deploy" button calls. No prior record
      #   required.
      - name: Trigger fresh deployment
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          SERVICE_ID: ${{ steps.resolve.outputs.service_id }}
          ENV_ID: ${{ steps.resolve.outputs.environment_id }}
        run: |
          set -euo pipefail
          mutation=$(jq -nc --arg sid "$SERVICE_ID" --arg eid "$ENV_ID" \
            '{query: "mutation($sid: String!, $eid: String!) { serviceInstanceDeployV2(serviceId: $sid, environmentId: $eid) }", variables: {sid: $sid, eid: $eid}}')
          resp=$(curl -sS -X POST https://backboard.railway.com/graphql/v2 \
            -H "Project-Access-Token: $RAILWAY_TOKEN" \
            -H "Content-Type: application/json" \
            -d "$mutation")
          if echo "$resp" | jq -e '.errors' >/dev/null 2>&1; then
            echo "serviceInstanceDeployV2 failed:"
            echo "$resp" | jq '.errors'
            exit 1
          fi
          echo "Fresh deployment triggered for $SERVICE_ID in env $ENV_ID"
          echo "$resp" | jq '.'
