name: Deploy

# Two-service Railway deploy. Triggered after CI (which includes the
# GHCR publish jobs on main) succeeds.
#
# How this works post-GHCR migration:
#   1. CI builds + verifies both services.
#   2. On push to main, CI's `build-rust-image` and `build-svelte-image`
#      jobs push `:latest` + `:<sha>` to GHCR.
#   3. This workflow fires on the completed CI run, authenticates to
#      Railway with a project-scoped token, and asks Railway to
#      re-pull the `:latest` image for each service.
#
# Railway services are configured (per-service dashboard) to pull from:
#   - mom-svelte  -> ghcr.io/matthewdehaas/mom-svelte:latest
#   - Rust-API    -> ghcr.io/matthewdehaas/mom-rust-api:latest
#
# No `railway up` / build-from-source anywhere in prod. The exact
# binary CI verified is the one that runs. Rollback = flip the service
# to pull `:<previous-sha>` from the dashboard, or push a revert PR.
#
# Required GitHub secrets:
#   - RAILWAY_TOKEN  project-scoped Railway token (v4 CLI format)

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy ${{ matrix.service }}
    runs-on: ubuntu-latest
    # Only run on successful CI completions, OR manual dispatch.
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    strategy:
      fail-fast: false
      matrix:
        service: [mom-svelte, Rust-API]

    steps:
      - name: Install Railway CLI
        # Pin v4 — v3.23.0 silently rejects the current project-token
        # format Railway's dashboard mints, returning `Unauthorized`
        # from `railway whoami` with no useful error. v4 accepts the
        # same `RAILWAY_TOKEN` env var and supports `redeploy`.
        run: npm install -g @railway/cli@4

      # `railway redeploy` tells Railway to re-pull the configured
      # image for the service. No source upload, no build on Railway's
      # side — just "fetch the latest tag and swap the running
      # container". The GHCR tag is set in the Railway dashboard.
      - name: Trigger Railway redeploy
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          railway redeploy \
            --service "${{ matrix.service }}" \
            --environment production \
            --yes
