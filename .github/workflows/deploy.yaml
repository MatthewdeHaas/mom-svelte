name: Deploy

# Two-service Railway deploy, triggered after CI succeeds on main.
#
# Secrets live in Railway's dashboard (per-service). Edit them there.
# This workflow does NOT push secrets — it only triggers builds. A
# secret set on `mom-svelte` is natively invisible to `Rust-API` and
# vice versa, so Railway's per-service env is the blast-radius bound.
#
# Required GitHub secrets:
#   - RAILWAY_TOKEN  project-scoped Railway token
#
# (We previously fetched secrets from Infisical here and pushed them
#  via `railway variables --set`. Removed 2026-10-09 — one deployer,
#  one env, nine secrets; the coupling wasn't worth the moving part.
#  See docs/track-4a-summary.md for the historical note.)

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy ${{ matrix.service }}
    runs-on: ubuntu-latest
    # Only run on successful CI completions, OR manual dispatch.
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    strategy:
      fail-fast: false
      matrix:
        service: [mom-svelte, Rust-API]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Railway CLI
        run: npm install -g @railway/cli@3

      # Project tokens in Railway CLI v3 are scoped to a SPECIFIC
      # ENVIRONMENT within a project. `railway up` defaults
      # --environment to the "linked environment" — which is empty in
      # CI (no `.railway/project.json` written by `railway link`), so
      # the CLI rejects the request with "Unauthorized" even when the
      # token itself is valid. Explicitly naming the environment
      # closes that gap; same token, no additional secrets.
      - name: Deploy to Railway
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          railway up \
            --service "${{ matrix.service }}" \
            --environment production \
            --detach
