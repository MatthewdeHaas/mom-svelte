name: Deploy

# Two-service Railway deploy, triggered after CI succeeds on main.
#
# Secrets live in Railway's dashboard (per-service). Edit them there.
# This workflow does NOT push secrets — it only triggers builds. A
# secret set on `mom-svelte` is natively invisible to `Rust-API` and
# vice versa, so Railway's per-service env is the blast-radius bound.
#
# Required GitHub secrets:
#   - RAILWAY_TOKEN  project-scoped Railway token
#
# (We previously fetched secrets from Infisical here and pushed them
#  via `railway variables --set`. Removed 2026-10-09 — one deployer,
#  one env, nine secrets; the coupling wasn't worth the moving part.
#  See docs/track-4a-summary.md for the historical note.)

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy ${{ matrix.service }}
    runs-on: ubuntu-latest
    # Only run on successful CI completions, OR manual dispatch.
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    strategy:
      fail-fast: false
      matrix:
        service: [mom-svelte, Rust-API]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Railway CLI
        # Pin v4 — v3.23.0 silently rejects the current project-token
        # format Railway's dashboard mints, returning `Unauthorized`
        # from `railway whoami` on freshly-minted production-scoped
        # tokens with no useful error. v4 accepts the same tokens and
        # the same `RAILWAY_TOKEN` env var; `railway up` flags are
        # unchanged. Confirmed via diagnostic deploy runs
        # 38654624233 / 38654901700 / 38655162310 (v3, all 401) vs
        # 38655329385 (v4, both services uploaded successfully).
        run: npm install -g @railway/cli@4

      # `railway up` defaults --environment to the token's linked
      # environment, which may not match in CI — passing it explicitly
      # closes that gap. Same token, no additional secrets.
      - name: Deploy to Railway
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          railway up \
            --service "${{ matrix.service }}" \
            --environment production \
            --detach
