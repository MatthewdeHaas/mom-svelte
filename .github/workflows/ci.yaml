name: CI

on:
  push:
    branches: [main]
    # Deploy-only changes (deploy.yaml, handoff docs) don't need the
    # full CI pipeline — deploy.yaml itself is validated by GitHub's
    # workflow parser on push, and the handoff doc is prose. Keeps a
    # pure deploy-step tweak from costing a 20+ min CI cycle. CI is
    # still exhaustive on any code or workflow-logic change.
    paths-ignore:
      - '.github/workflows/deploy.yaml'
      - 'docs/**'
      - '**.md'
  pull_request:
    branches: [main]
    paths-ignore:
      - '.github/workflows/deploy.yaml'
      - 'docs/**'
      - '**.md'
  workflow_dispatch:

jobs:
  ci:
    name: Typecheck & Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: meals_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: meals_test
      POSTGRES_HOST: localhost
      BETTER_AUTH_SECRET: ci-secret-not-used-in-prod
      BETTER_AUTH_URL: http://localhost:5173
      ADMIN_EMAIL: admin@test.com
      RESEND_API_KEY: re_placeholder
      EMAIL_FROM: "Meals on the Move <noreply@test.internal>"

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10
          run_install: false

      - name: Get pnpm store directory
        id: pnpm-cache
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

      - name: Cache pnpm store
        uses: actions/cache@v5
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint migrations
        run: pnpm run lint:migrations

      - name: Run migrations
        run: pnpm run migrate

      - name: Typecheck
        run: pnpm run check

      - name: Test
        run: pnpm run test

  rust-ci:
    name: Rust fmt / clippy / sqlx / test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: meals_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: meals_test
      POSTGRES_HOST: localhost
      DATABASE_URL: postgres://test:test@localhost:5432/meals_test

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # ubuntu-latest ships with ~14 GB free. The Nix store (dep layer
      # ~5–6 GB) + the cargo test `target/` dir (~4–5 GB with every
      # workspace test binary in debug mode) + apt caches blow past
      # that on first cold run — the runner's own worker fails to
      # write its diagnostic log and the job dies before step logs
      # upload (seen in run 38630081642). This step removes dotnet,
      # Haskell, Android SDK, hostedtoolcache (~30 GB reclaimed in
      # ~60s). Required until the Nix cache is warm enough that we
      # don't need both deps-in-store AND deps-in-target coexisting.
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          swap-storage: false

      # Nix Tier 2: the flake is the single source of toolchain truth
      # for Rust (rustc, cargo, clippy, rustfmt) and sqlx-cli. No more
      # `actions-rust-lang/setup-rust-toolchain` + `cargo install sqlx-cli`
      # drift between local and CI.
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      # Free, zero-config GHA cache for Nix store paths. First run builds
      # cold (~5–6 min for the Rust dep layer); subsequent runs on the
      # same lockfile hit the cache in seconds.
      - name: Magic Nix Cache
        uses: DeterminateSystems/magic-nix-cache-action@main

      # Cross-run cargo cache. Snapshots ~/.cargo/registry +
      # ~/.cargo/git + admin-operations-rust/target/ keyed on
      # Cargo.lock + rustc version. Magic Nix Cache only serves the
      # `nix build .#api` artifact — the three cargo passes below
      # (fmt is ~free, clippy ~5min, test ~5min cold) write to
      # target/ outside the Nix store, so they rebuild all 450+ deps
      # from scratch every push. This action restores target/deps/
      # so each cargo pass only recompiles the workspace crates
      # themselves (~45s each warm vs ~5min cold).
      #
      # Separate `workspaces` entry because the manifest lives one
      # level deep from the repo root, not at the top.
      - name: Rust toolchain cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: admin-operations-rust

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10
          run_install: false

      - name: Get pnpm store directory
        id: pnpm-cache
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

      - name: Cache pnpm store
        uses: actions/cache@v5
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Sync migrations into Rust crate
        run: pnpm run rust:sync-migrations

      # Node migrations seed the schema that cargo test's integration
      # tests run against. (The dedicated `sqlx prepare --check` gate
      # has been removed — `cargo clippy` and `cargo test` below both
      # run with SQLX_OFFLINE=true via the committed .cargo/config.toml
      # and fail at macro expansion the same way `prepare --check`
      # does when a committed .sqlx/ entry drifts. One compile, same
      # signal, ~90s cheaper per run.)
      - name: Run Node migrations (seeds schema for Rust tests)
        run: pnpm run migrate

      # All cargo steps below run inside the flake's devShell so they
      # share the exact toolchain `nix build .#api` uses.
      - name: cargo fmt --check
        working-directory: admin-operations-rust
        run: nix develop ..#default --command cargo fmt --check

      - name: cargo clippy -D warnings
        working-directory: admin-operations-rust
        run: nix develop ..#default --command cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test --workspace
        working-directory: admin-operations-rust
        run: nix develop ..#default --command cargo test --workspace

  # Build the Rust API binary once per push and share it as a GHA
  # artifact. Both `e2e` (webServer boot) and `build-rust-image` (GHCR
  # Docker image) consume the same artifact — guarantees the three
  # places that need "the API binary" all see the exact same bytes,
  # and shaves ~4-5 min cold from the E2E critical path (which
  # previously ran its own `nix build .#api`).
  #
  # Artifact-scoped vs cache-scoped: artifacts are keyed by run_id, so
  # downstream jobs in the same run always consume the binary this job
  # just produced — zero stale-cache risk. Retention is 1 day because
  # the artifact is only useful within its own run; once e2e + the
  # image build consume it, nothing else references it.
  build-api:
    name: Build Rust API binary
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          swap-storage: false

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Magic Nix Cache
        uses: DeterminateSystems/magic-nix-cache-action@main

      # Build the static-musl variant (`.#api-static`), not the
      # default glibc variant. The glibc build links against Nix's
      # own ld-linux loader via an ELF interpreter path pointing
      # into `/nix/store/...`; that path doesn't exist on stock
      # ubuntu-latest, so Playwright's webServer exec of the binary
      # ENOENTs with exit 127 ("not found") during E2E. The static
      # variant has no interpreter and runs anywhere. The Rust side
      # is already pure-rustls (sqlx `tls-rustls`, reqwest
      # `rustls-tls`), so musl is safe — no runtime openssl needed.
      - name: Build Rust API (static-musl) via Nix
        run: nix build .#api-static --print-build-logs

      # `result/bin/api` is a symlink into the Nix store. upload-artifact
      # follows symlinks when `path:` points at the file directly, but
      # we copy to a plain file first to make the artifact self-describing
      # regardless of consumer behaviour.
      - name: Stage binary for upload
        run: |
          mkdir -p artifact
          cp result/bin/api artifact/api
          chmod +w artifact/api

      - name: Upload Rust API binary
        uses: actions/upload-artifact@v4
        with:
          name: rust-api-binary
          path: artifact/api
          retention-days: 1
          if-no-files-found: error

  # Fast-feedback job for the pure-logic crates. No Postgres, no
  # migrations, no DB env — just `cargo test --lib` across the crates
  # whose tests touch zero sqlx. Catches a broken formatter / fuzzy
  # matcher / ISO-date regex / XMP scrub in ~45s warm, without waiting
  # on `rust-ci`'s full DB-test matrix.
  #
  # Covers (zero `sqlx::test` in any of these):
  #   - excel  (determinism, boilerplate, fuzzy, parse, headers,
  #             meals, recipes, validate, normalise)
  #   - pdf    (determinism)
  #   - domain (import, recipes)
  #   - flags-tui (emit render body — integration test, no DB)
  #
  # Duplication vs `rust-ci --workspace`: intentional. `rust-unit` is
  # the fast signal; `rust-ci` is the coverage gate. Deduplicating
  # would need per-crate `cargo test` lines in `rust-ci` for ~2s saved.
  rust-unit:
    name: Rust unit tests (no DB)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Magic Nix Cache
        uses: DeterminateSystems/magic-nix-cache-action@main

      # Distinct `shared-key` so this job's cache doesn't collide with
      # `rust-ci`'s. Both key on Cargo.lock + rustc, but the target/
      # dirs differ (test deps vs workspace deps) and sharing one key
      # thrashes the restore step.
      - name: Rust toolchain cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: admin-operations-rust
          shared-key: unit
          cache-on-failure: true

      # `crates/db` uses `sqlx::migrate!("./../../migrations")`, a
      # compile-time macro that canonicalizes the directory at macro
      # expansion. Even though these pure unit tests never touch the
      # DB, `cargo test -p excel` compiles the `db` crate as a
      # transitive dep (via `domain` → `db`), so the macro fires and
      # fails without the migrations directory present. The sync
      # script copies `scripts/migrations/*` into
      # `admin-operations-rust/migrations/` (gitignored). Mirrors the
      # Node + pnpm + install + sync-migrations block `rust-ci` uses.
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10
          run_install: false

      - name: Get pnpm store directory
        id: pnpm-cache
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

      - name: Cache pnpm store
        uses: actions/cache@v5
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Sync migrations into Rust crate
        run: pnpm run rust:sync-migrations

      # `cargo nextest run` instead of `cargo test`: parallel execution
      # and far more readable failure output. Byte-equality asserts in
      # `determinism.rs` previously dumped unreadable `Vec<u8>` under
      # `cargo test` — nextest formats them, groups per-test, and
      # surfaces timing. Skips doctests by design; the pure crates
      # have none, so no coverage loss. `cargo-nextest` is provided by
      # the flake's devShell.
      - name: cargo nextest (pure crates)
        working-directory: admin-operations-rust
        run: nix develop ..#default --command cargo nextest run -p excel -p pdf -p domain --lib

      - name: cargo nextest --test emit (flags-tui pure integration)
        working-directory: admin-operations-rust
        run: nix develop ..#default --command cargo nextest run -p flags-tui --test emit

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: [ci, rust-ci, build-api]
    # Previously built the Rust API in-job via `nix build .#api`; now
    # consumes the `rust-api-binary` artifact uploaded by `build-api`.
    # Keeps `ci` + `rust-ci` as gates (both lanes must be green before
    # we spend minutes on E2E).

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: meals_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: meals_test
      POSTGRES_HOST: localhost
      BETTER_AUTH_SECRET: ci-secret-not-used-in-prod
      # Must match Vite's bind port in playwright.config.ts (5174). The
      # Vite webServer command passes `--port 5174` explicitly; if these
      # env vars disagree, Playwright polls one port while Vite listens
      # on another and the webServer wait times out at 180s. Better Auth
      # also reads BETTER_AUTH_URL for its origin check — a mismatch
      # here fails every SSR load with a CSRF error.
      BETTER_AUTH_URL: http://localhost:5174
      PLAYWRIGHT_BASE_URL: http://localhost:5174
      ADMIN_EMAIL: admin@test.com
      RESEND_API_KEY: re_placeholder
      EMAIL_FROM: "Meals on the Move <noreply@test.internal>"

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # Same disk reclamation as `rust-ci` — Nix store + release target
      # + Playwright browser cache + pnpm store together exceed the
      # ~14 GB free `ubuntu-latest` ships with.
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          swap-storage: false

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10
          run_install: false

      - name: Get pnpm store directory
        id: pnpm-cache
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

      - name: Cache pnpm store
        uses: actions/cache@v5
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install chromium --with-deps

      - name: Run migrations
        run: pnpm run migrate

      # `crates/db` uses `sqlx::migrate!("./../../migrations")` which
      # resolves to `admin-operations-rust/migrations/` — a gitignored
      # directory populated at build time by this sync script. Without
      # it, `cargo build` fails at macro-expansion with "error
      # canonicalizing migration directory". The `rust-ci` job runs
      # this sync too; e2e needs its own copy before the release build.
      # Must come before the ledger stamp (which reads this directory).
      - name: Sync migrations into Rust crate
        run: pnpm run rust:sync-migrations

      # Stamp `_sqlx_migrations` so the Rust API's startup migrator is
      # a no-op. The TS migrator just applied all 24 files but tracks
      # them in `migrations` (sha256); sqlx tracks them in
      # `_sqlx_migrations` (SHA-384). Without this stamp, the Rust
      # binary spawned by Playwright's `webServer` sees an empty sqlx
      # ledger and tries to re-run everything — migration 4 fails with
      # "cannot drop table users because other objects depend on it"
      # because migrations 1-3 already created users + FKs to it.
      #
      # `tests/e2e/global-setup.ts::backfillSqlxLedger` also does this,
      # but Playwright runs globalSetup AFTER starting webServers — too
      # late. Stamp from CI before the Rust server comes up.
      - name: Stamp sqlx migration ledger
        run: pnpm run migrate:backfill-sqlx

      # Pull the Rust API binary built once by the `build-api` job
      # into the path Playwright's `webServer` block expects
      # (`./admin-operations-rust/target/release/api`). Playwright
      # starts webServers BEFORE globalSetup — the binary must exist
      # on disk when the webServer command fires.
      #
      # Previously this job ran its own `nix build .#api`; promoting it
      # to a shared GHA artifact removes a 4-5min cold Rust compile
      # from the E2E critical path (and from `build-rust-image` once
      # PR #1 merges).
      - name: Download Rust API binary
        uses: actions/download-artifact@v4
        with:
          name: rust-api-binary
          path: admin-operations-rust/target/release
      - name: Make binary executable
        run: chmod +x admin-operations-rust/target/release/api

      - name: Run E2E tests
        run: pnpm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      # Rust tracing file sink — written by the api binary when
      # `RUST_LOG_FILE` is set (see `playwright.config.ts` webServer
      # env). Closes the stdio-capture gap: Playwright's `sh -c` spawn
      # of a native binary swallows stdout under some reporters, so
      # the only reliable way to see what the Rust import handler
      # actually did during a failed E2E run is to read it off disk.
      - name: Upload Rust API log
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: rust-api-log
          path: /tmp/rust-api.log
          retention-days: 7
          if-no-files-found: warn

  # ---------------------------------------------------------------
  # GHCR publish jobs.
  #
  # Both run only on push to main, after their respective gates are
  # green. The result is two tags per service:
  #   - :latest   — moved on every main push
  #   - :<sha>    — immutable, for rollback via `railway redeploy`
  #
  # Railway is configured (dashboard, per service) to pull from
  # ghcr.io/matthewdehaas/<name>:latest. `deploy.yaml` just kicks
  # Railway to re-pull after the push lands.
  #
  # Retention: GHCR free tier caps storage; we keep the 10 most
  # recent SHA-tagged versions per package and prune the rest. The
  # `:latest` tag is preserved because `actions/delete-package-versions`
  # with `delete-only-untagged-versions: false` + `min-versions-to-keep`
  # keeps the newest N regardless of tag — `:latest` always points at
  # the most recent push, so it survives.
  # ---------------------------------------------------------------

  build-rust-image:
    name: Build & push Rust API image
    runs-on: ubuntu-latest
    needs: [rust-ci, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          swap-storage: false

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Magic Nix Cache
        uses: DeterminateSystems/magic-nix-cache-action@main

      # Reproduce the exact binary CI's `e2e` job verified.
      - name: Build Rust API via Nix
        run: |
          nix build .#api --print-build-logs
          mkdir -p admin-operations-rust/target/release
          cp result/bin/api admin-operations-rust/target/release/api
          chmod +w admin-operations-rust/target/release/api

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: admin-operations-rust/Dockerfile
          push: true
          tags: |
            ghcr.io/matthewdehaas/mom-rust-api:latest
            ghcr.io/matthewdehaas/mom-rust-api:${{ github.sha }}
          # Workflow-scoped buildx cache. Dockerfile is already
          # runtime-only (one COPY of a pre-built binary) so warm
          # builds are seconds; this just keeps the base image layers
          # pinned between runs.
          cache-from: type=gha,scope=rust-image
          cache-to: type=gha,mode=max,scope=rust-image

      # Keep the newest 10 versions of this package; delete the rest.
      # :latest moved to the just-pushed version in the step above, so
      # it's always among the kept 10. Older :<sha> tags fall off.
      - name: Prune old GHCR versions
        uses: actions/delete-package-versions@v5
        with:
          package-name: mom-rust-api
          package-type: container
          min-versions-to-keep: 10
          delete-only-untagged-versions: false

  build-svelte-image:
    name: Build & push SvelteKit image
    runs-on: ubuntu-latest
    needs: [ci]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ghcr.io/matthewdehaas/mom-svelte:latest
            ghcr.io/matthewdehaas/mom-svelte:${{ github.sha }}
          cache-from: type=gha,scope=svelte-image
          cache-to: type=gha,mode=max,scope=svelte-image

      - name: Prune old GHCR versions
        uses: actions/delete-package-versions@v5
        with:
          package-name: mom-svelte
          package-type: container
          min-versions-to-keep: 10
          delete-only-untagged-versions: false
