name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  ci:
    name: Typecheck & Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: meals_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: meals_test
      POSTGRES_HOST: localhost
      BETTER_AUTH_SECRET: ci-secret-not-used-in-prod
      BETTER_AUTH_URL: http://localhost:5173
      ADMIN_EMAIL: admin@test.com
      RESEND_API_KEY: re_placeholder
      EMAIL_FROM: "Meals on the Move <noreply@test.internal>"

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10
          run_install: false

      - name: Get pnpm store directory
        id: pnpm-cache
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

      - name: Cache pnpm store
        uses: actions/cache@v5
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint migrations
        run: pnpm run lint:migrations

      - name: Run migrations
        run: pnpm run migrate

      - name: Typecheck
        run: pnpm run check

      - name: Test
        run: pnpm run test

  rust-ci:
    name: Rust fmt / clippy / sqlx / test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: meals_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: meals_test
      POSTGRES_HOST: localhost
      DATABASE_URL: postgres://test:test@localhost:5432/meals_test

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # ubuntu-latest ships with ~14 GB free. The Nix store (dep layer
      # ~5–6 GB) + the cargo test `target/` dir (~4–5 GB with every
      # workspace test binary in debug mode) + apt caches blow past
      # that on first cold run — the runner's own worker fails to
      # write its diagnostic log and the job dies before step logs
      # upload (seen in run 38630081642). This step removes dotnet,
      # Haskell, Android SDK, hostedtoolcache (~30 GB reclaimed in
      # ~60s). Required until the Nix cache is warm enough that we
      # don't need both deps-in-store AND deps-in-target coexisting.
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          swap-storage: false

      # Nix Tier 2: the flake is the single source of toolchain truth
      # for Rust (rustc, cargo, clippy, rustfmt) and sqlx-cli. No more
      # `actions-rust-lang/setup-rust-toolchain` + `cargo install sqlx-cli`
      # drift between local and CI.
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      # Free, zero-config GHA cache for Nix store paths. First run builds
      # cold (~5–6 min for the Rust dep layer); subsequent runs on the
      # same lockfile hit the cache in seconds.
      - name: Magic Nix Cache
        uses: DeterminateSystems/magic-nix-cache-action@main

      # Cross-run cargo cache. Snapshots ~/.cargo/registry +
      # ~/.cargo/git + admin-operations-rust/target/ keyed on
      # Cargo.lock + rustc version. Magic Nix Cache only serves the
      # `nix build .#api` artifact — the three cargo passes below
      # (fmt is ~free, clippy ~5min, test ~5min cold) write to
      # target/ outside the Nix store, so they rebuild all 450+ deps
      # from scratch every push. This action restores target/deps/
      # so each cargo pass only recompiles the workspace crates
      # themselves (~45s each warm vs ~5min cold).
      #
      # Separate `workspaces` entry because the manifest lives one
      # level deep from the repo root, not at the top.
      - name: Rust toolchain cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: admin-operations-rust

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10
          run_install: false

      - name: Get pnpm store directory
        id: pnpm-cache
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

      - name: Cache pnpm store
        uses: actions/cache@v5
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Sync migrations into Rust crate
        run: pnpm run rust:sync-migrations

      # Node migrations seed the schema that cargo test's integration
      # tests run against. (The dedicated `sqlx prepare --check` gate
      # has been removed — `cargo clippy` and `cargo test` below both
      # run with SQLX_OFFLINE=true via the committed .cargo/config.toml
      # and fail at macro expansion the same way `prepare --check`
      # does when a committed .sqlx/ entry drifts. One compile, same
      # signal, ~90s cheaper per run.)
      - name: Run Node migrations (seeds schema for Rust tests)
        run: pnpm run migrate

      # All cargo steps below run inside the flake's devShell so they
      # share the exact toolchain `nix build .#api` uses.
      - name: cargo fmt --check
        working-directory: admin-operations-rust
        run: nix develop ..#default --command cargo fmt --check

      - name: cargo clippy -D warnings
        working-directory: admin-operations-rust
        run: nix develop ..#default --command cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test --workspace
        working-directory: admin-operations-rust
        run: nix develop ..#default --command cargo test --workspace

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: [ci, rust-ci]

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: meals_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: meals_test
      POSTGRES_HOST: localhost
      BETTER_AUTH_SECRET: ci-secret-not-used-in-prod
      # Must match Vite's bind port in playwright.config.ts (5174). The
      # Vite webServer command passes `--port 5174` explicitly; if these
      # env vars disagree, Playwright polls one port while Vite listens
      # on another and the webServer wait times out at 180s. Better Auth
      # also reads BETTER_AUTH_URL for its origin check — a mismatch
      # here fails every SSR load with a CSRF error.
      BETTER_AUTH_URL: http://localhost:5174
      PLAYWRIGHT_BASE_URL: http://localhost:5174
      ADMIN_EMAIL: admin@test.com
      RESEND_API_KEY: re_placeholder
      EMAIL_FROM: "Meals on the Move <noreply@test.internal>"

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # Same disk reclamation as `rust-ci` — Nix store + release target
      # + Playwright browser cache + pnpm store together exceed the
      # ~14 GB free `ubuntu-latest` ships with.
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          swap-storage: false

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10
          run_install: false

      # Nix Tier 2: build the Rust API via `nix build .#api` instead of
      # `cargo build --release`. The flake pins toolchain, deps,
      # sqlx-cli — all the knobs that previously drifted between a
      # local dev loop and this runner.
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Magic Nix Cache
        uses: DeterminateSystems/magic-nix-cache-action@main

      - name: Get pnpm store directory
        id: pnpm-cache
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

      - name: Cache pnpm store
        uses: actions/cache@v5
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install chromium --with-deps

      - name: Run migrations
        run: pnpm run migrate

      # `crates/db` uses `sqlx::migrate!("./../../migrations")` which
      # resolves to `admin-operations-rust/migrations/` — a gitignored
      # directory populated at build time by this sync script. Without
      # it, `cargo build` fails at macro-expansion with "error
      # canonicalizing migration directory". The `rust-ci` job runs
      # this sync too; e2e needs its own copy before the release build.
      # Must come before the ledger stamp (which reads this directory).
      - name: Sync migrations into Rust crate
        run: pnpm run rust:sync-migrations

      # Stamp `_sqlx_migrations` so the Rust API's startup migrator is
      # a no-op. The TS migrator just applied all 24 files but tracks
      # them in `migrations` (sha256); sqlx tracks them in
      # `_sqlx_migrations` (SHA-384). Without this stamp, the Rust
      # binary spawned by Playwright's `webServer` sees an empty sqlx
      # ledger and tries to re-run everything — migration 4 fails with
      # "cannot drop table users because other objects depend on it"
      # because migrations 1-3 already created users + FKs to it.
      #
      # `tests/e2e/global-setup.ts::backfillSqlxLedger` also does this,
      # but Playwright runs globalSetup AFTER starting webServers — too
      # late. Stamp from CI before the Rust server comes up.
      - name: Stamp sqlx migration ledger
        run: pnpm run migrate:backfill-sqlx

      # Build the Rust API via Nix, then copy the result into the path
      # Playwright's `webServer` block in `playwright.config.ts` expects
      # (`./admin-operations-rust/target/release/api`). Playwright starts
      # webServers BEFORE globalSetup — the binary must exist on disk
      # when the webServer command fires.
      #
      # The copy is cheap (one 12 MB file) and keeps the Playwright
      # config path-stable, so local dev (`cargo build --release`) and
      # CI (`nix build`) land the binary in the same place.
      - name: Build Rust API via Nix
        run: |
          nix build .#api --print-build-logs
          mkdir -p admin-operations-rust/target/release
          cp result/bin/api admin-operations-rust/target/release/api
          chmod +w admin-operations-rust/target/release/api

      - name: Run E2E tests
        run: pnpm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      # Rust tracing file sink — written by the api binary when
      # `RUST_LOG_FILE` is set (see `playwright.config.ts` webServer
      # env). Closes the stdio-capture gap: Playwright's `sh -c` spawn
      # of a native binary swallows stdout under some reporters, so
      # the only reliable way to see what the Rust import handler
      # actually did during a failed E2E run is to read it off disk.
      - name: Upload Rust API log
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: rust-api-log
          path: /tmp/rust-api.log
          retention-days: 7
          if-no-files-found: warn

  # ---------------------------------------------------------------
  # GHCR publish jobs.
  #
  # Both run only on push to main, after their respective gates are
  # green. The result is two tags per service:
  #   - :latest   — moved on every main push
  #   - :<sha>    — immutable, for rollback via `railway redeploy`
  #
  # Railway is configured (dashboard, per service) to pull from
  # ghcr.io/matthewdehaas/<name>:latest. `deploy.yaml` just kicks
  # Railway to re-pull after the push lands.
  #
  # Retention: GHCR free tier caps storage; we keep the 10 most
  # recent SHA-tagged versions per package and prune the rest. The
  # `:latest` tag is preserved because `actions/delete-package-versions`
  # with `delete-only-untagged-versions: false` + `min-versions-to-keep`
  # keeps the newest N regardless of tag — `:latest` always points at
  # the most recent push, so it survives.
  # ---------------------------------------------------------------

  build-rust-image:
    name: Build & push Rust API image
    runs-on: ubuntu-latest
    needs: [rust-ci, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          swap-storage: false

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Magic Nix Cache
        uses: DeterminateSystems/magic-nix-cache-action@main

      # Reproduce the exact binary CI's `e2e` job verified.
      - name: Build Rust API via Nix
        run: |
          nix build .#api --print-build-logs
          mkdir -p admin-operations-rust/target/release
          cp result/bin/api admin-operations-rust/target/release/api
          chmod +w admin-operations-rust/target/release/api

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: admin-operations-rust/Dockerfile
          push: true
          tags: |
            ghcr.io/matthewdehaas/mom-rust-api:latest
            ghcr.io/matthewdehaas/mom-rust-api:${{ github.sha }}
          # Workflow-scoped buildx cache. Dockerfile is already
          # runtime-only (one COPY of a pre-built binary) so warm
          # builds are seconds; this just keeps the base image layers
          # pinned between runs.
          cache-from: type=gha,scope=rust-image
          cache-to: type=gha,mode=max,scope=rust-image

      # Keep the newest 10 versions of this package; delete the rest.
      # :latest moved to the just-pushed version in the step above, so
      # it's always among the kept 10. Older :<sha> tags fall off.
      - name: Prune old GHCR versions
        uses: actions/delete-package-versions@v5
        with:
          package-name: mom-rust-api
          package-type: container
          min-versions-to-keep: 10
          delete-only-untagged-versions: false

  build-svelte-image:
    name: Build & push SvelteKit image
    runs-on: ubuntu-latest
    needs: [ci]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ghcr.io/matthewdehaas/mom-svelte:latest
            ghcr.io/matthewdehaas/mom-svelte:${{ github.sha }}
          cache-from: type=gha,scope=svelte-image
          cache-to: type=gha,mode=max,scope=svelte-image

      - name: Prune old GHCR versions
        uses: actions/delete-package-versions@v5
        with:
          package-name: mom-svelte
          package-type: container
          min-versions-to-keep: 10
          delete-only-untagged-versions: false
