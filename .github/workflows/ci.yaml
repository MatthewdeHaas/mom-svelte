name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    name: Typecheck & Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: meals_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: meals_test
      POSTGRES_HOST: localhost
      BETTER_AUTH_SECRET: ci-secret-not-used-in-prod
      BETTER_AUTH_URL: http://localhost:5173
      ADMIN_EMAIL: admin@test.com
      RESEND_API_KEY: re_placeholder
      EMAIL_FROM: "Meals on the Move <noreply@test.internal>"

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10
          run_install: false

      - name: Get pnpm store directory
        id: pnpm-cache
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

      - name: Cache pnpm store
        uses: actions/cache@v5
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint migrations
        run: pnpm run lint:migrations

      - name: Run migrations
        run: pnpm run migrate

      - name: Typecheck
        run: pnpm run check

      - name: Test
        run: pnpm run test

  rust-ci:
    name: Rust fmt / clippy / sqlx / test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: meals_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: meals_test
      POSTGRES_HOST: localhost
      DATABASE_URL: postgres://test:test@localhost:5432/meals_test

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          rustflags: ""
          cache-workspaces: admin-operations-rust

      - name: Install sqlx-cli
        # Pin to a concrete patch — newer cargo rejects bare `0.8`
        # ("unexpected end of input while parsing minor version"). Match
        # the flake's sqlx-cli 0.8.6 so CI and local resolve the same tool.
        run: cargo install sqlx-cli --version 0.8.6 --no-default-features --features native-tls,postgres --locked

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10
          run_install: false

      - name: Get pnpm store directory
        id: pnpm-cache
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

      - name: Cache pnpm store
        uses: actions/cache@v5
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Sync migrations into Rust crate
        run: pnpm run rust:sync-migrations

      # Node migrations must run BEFORE the sqlx gate: `cargo sqlx
      # prepare --check` re-runs every query macro against a LIVE DB
      # and diffs the result against the committed `.sqlx/` cache.
      # `SQLX_OFFLINE=true` only affects compile-time macro
      # expansion, not the prepare subcommand itself. An empty DB
      # here surfaces as "relation X does not exist" from inside the
      # cache check, which looks like a cache problem but is really
      # a step-ordering problem.
      - name: Run Node migrations (seeds schema for Rust tests)
        run: pnpm run migrate

      - name: sqlx offline cache check (fatal gate)
        run: pnpm run rust:prepare-check

      - name: cargo fmt --check
        working-directory: admin-operations-rust
        run: cargo fmt --check

      - name: cargo clippy -D warnings
        working-directory: admin-operations-rust
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test --workspace
        working-directory: admin-operations-rust
        run: cargo test --workspace

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: [ci, rust-ci]

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: meals_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: meals_test
      POSTGRES_HOST: localhost
      BETTER_AUTH_SECRET: ci-secret-not-used-in-prod
      BETTER_AUTH_URL: http://localhost:5173
      PLAYWRIGHT_BASE_URL: http://localhost:5173
      ADMIN_EMAIL: admin@test.com
      RESEND_API_KEY: re_placeholder
      EMAIL_FROM: "Meals on the Move <noreply@test.internal>"

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10
          run_install: false

      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          rustflags: ""
          cache-workspaces: admin-operations-rust

      - name: Get pnpm store directory
        id: pnpm-cache
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

      - name: Cache pnpm store
        uses: actions/cache@v5
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install chromium --with-deps

      - name: Run migrations
        run: pnpm run migrate

      # Pre-build the Rust API binary. Playwright's `webServer` block in
      # `playwright.config.ts` spawns `./admin-operations-rust/target/release/api`
      # directly, and Playwright starts webServers BEFORE running globalSetup —
      # so the binary must exist on disk when the webServer command fires.
      # `global-setup.ts` also runs `cargo build --release -p api` for local
      # first-run ergonomics; in CI that call becomes a cheap cache hit.
      - name: Build Rust API (release)
        working-directory: admin-operations-rust
        run: cargo build --release -p api

      - name: Run E2E tests
        run: pnpm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
