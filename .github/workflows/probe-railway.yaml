name: Probe Railway

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Compare auth headers for project token
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          set -euo pipefail
          Q='{"query":"{ projectToken { projectId environmentId project { id name services { edges { node { id name } } } } } }"}'

          echo "=== (A) Authorization: Bearer ==="
          curl -sS -X POST https://backboard.railway.com/graphql/v2 \
            -H "Authorization: Bearer $RAILWAY_TOKEN" \
            -H "Content-Type: application/json" \
            -d "$Q" | jq '.'

          echo "=== (B) Project-Access-Token header ==="
          curl -sS -X POST https://backboard.railway.com/graphql/v2 \
            -H "Project-Access-Token: $RAILWAY_TOKEN" \
            -H "Content-Type: application/json" \
            -d "$Q" | jq '.'

          echo "=== (C) X-Project-Token header ==="
          curl -sS -X POST https://backboard.railway.com/graphql/v2 \
            -H "X-Project-Token: $RAILWAY_TOKEN" \
            -H "Content-Type: application/json" \
            -d "$Q" | jq '.'

          echo "=== (D) raw Authorization (no Bearer) ==="
          curl -sS -X POST https://backboard.railway.com/graphql/v2 \
            -H "Authorization: $RAILWAY_TOKEN" \
            -H "Content-Type: application/json" \
            -d "$Q" | jq '.'
