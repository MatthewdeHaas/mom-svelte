name: Release

# GHCR publish for both services on main-push.
#
# Previously part of `ci.yaml`, split out so that merging a PR to
# main no longer re-runs the full test suite on identical code.
# Branch protection enforces that only PR-tested commits can reach
# main (`main-protection` ruleset — required status checks are the
# PR-side jobs in ci.yaml), so re-verifying here would be waste.
#
# What this workflow does on every main-push:
#   1. Build the Rust API binary (static-musl).
#   2. Push both services to GHCR as `:latest` + `:<sha>`.
#   3. Prune to the newest 10 versions per package (GHCR free tier).
#
# The downstream `deploy.yaml` watches this workflow (not CI) and
# fires its Railway deploy on successful completion.
#
# No `needs:` cross-workflow — `release.yaml` and `ci.yaml` share
# only the main branch and the git tree. If a commit lands on main
# without being PR-tested, that's a branch-protection bug, not
# something this workflow should re-check.

on:
  push:
    branches: [main]
    # Deploy-only + docs-only changes don't need a new image.
    # Mirrors ci.yaml's filter so paired PRs on both lanes agree.
    paths-ignore:
      - '.github/workflows/deploy.yaml'
      - 'docs/**'
      - '**.md'
  workflow_dispatch:

jobs:
  # ---------------------------------------------------------------
  # GHCR publish jobs. Two tags per service:
  #   - :latest   — moved on every main push
  #   - :<sha>    — immutable, for rollback via workflow_dispatch
  #                 of deploy.yaml pointed at an older SHA
  #
  # Railway is configured (dashboard, per service) to pull from
  # ghcr.io/matthewdehaas/<name>:latest. `deploy.yaml` kicks
  # Railway to re-pull after this workflow completes.
  #
  # Retention: GHCR free tier caps storage; we keep the 10 most
  # recent SHA-tagged versions per package and prune the rest. The
  # `:latest` tag is preserved because `actions/delete-package-versions`
  # with `delete-only-untagged-versions: false` + `min-versions-to-keep`
  # keeps the newest N regardless of tag — `:latest` always points at
  # the most recent push, so it survives.
  # ---------------------------------------------------------------

  build-rust-image:
    name: Build & push Rust API image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          swap-storage: false

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Magic Nix Cache
        uses: DeterminateSystems/magic-nix-cache-action@main

      # Build the static-musl variant (`.#api-static`), not the
      # default glibc variant. The glibc build links against Nix's
      # own ld-linux loader via an ELF interpreter path pointing
      # into `/nix/store/...`; the Alpine-based runtime image doesn't
      # have that path, so the container would ENOENT on startup.
      # The static variant has no interpreter and runs anywhere.
      - name: Build Rust API (static-musl) via Nix
        run: nix build .#api-static --print-build-logs

      # `result/bin/api` is a symlink into the Nix store. Stage it
      # as a plain file so the Dockerfile's COPY sees a real binary
      # at the expected path.
      - name: Stage binary for image build
        run: |
          mkdir -p admin-operations-rust/target/release
          cp result/bin/api admin-operations-rust/target/release/api
          chmod +x admin-operations-rust/target/release/api

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: admin-operations-rust/Dockerfile
          push: true
          tags: |
            ghcr.io/matthewdehaas/mom-rust-api:latest
            ghcr.io/matthewdehaas/mom-rust-api:${{ github.sha }}
          # Workflow-scoped buildx cache. Dockerfile is already
          # runtime-only (one COPY of a pre-built binary) so warm
          # builds are seconds; this just keeps the base image layers
          # pinned between runs.
          cache-from: type=gha,scope=rust-image
          cache-to: type=gha,mode=max,scope=rust-image

      # Delete only untagged (orphaned) versions. We previously ran
      # with `delete-only-untagged-versions: false` + `min-versions-to-keep: 10`,
      # which deleted tagged versions too — relying on "newest 10 by
      # creation keeps :latest and the fresh :<sha>." That assumption
      # broke on 2026-10-16: the just-pushed version for
      # 75491cf535542d4125aa1d953520ae1545b2ea65 was pruned seconds
      # after push, and Deploy 404'd pulling the image. Likely cause:
      # when GHCR indexes a just-pushed version, its `created_at` can
      # momentarily lag older versions, so "newest N by creation" can
      # exclude the fresh push. Switching to tagged-safe prune: tagged
      # versions are kept forever; only orphan untagged layer-manifests
      # get collected. GHCR storage grows linearly with pushes — fine
      # for this 2-service repo for the foreseeable future.
      - name: Prune old GHCR versions
        uses: actions/delete-package-versions@v5
        with:
          package-name: mom-rust-api
          package-type: container
          min-versions-to-keep: 10
          delete-only-untagged-versions: true

  build-svelte-image:
    name: Build & push SvelteKit image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ghcr.io/matthewdehaas/mom-svelte:latest
            ghcr.io/matthewdehaas/mom-svelte:${{ github.sha }}
          cache-from: type=gha,scope=svelte-image
          cache-to: type=gha,mode=max,scope=svelte-image

      # Tagged-safe prune — see build-rust-image's prune step for why.
      - name: Prune old GHCR versions
        uses: actions/delete-package-versions@v5
        with:
          package-name: mom-svelte
          package-type: container
          min-versions-to-keep: 10
          delete-only-untagged-versions: true
