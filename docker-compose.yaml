services:
  # Compose runs Postgres only. The Rust API runs host-side via
  # `scripts/rust.sh` (nix develop + cargo run) so dev uses the same
  # toolchain CI pins (`rust-bin.stable.latest` from flake.nix) with
  # no cross-arch Mach-O-into-Linux landmine from a stale
  # `target/release/api`. The former `rust-api` service required a
  # CI-produced Linux ELF at that path and crashloop'd with
  # `exec format error` when a local `cargo build` populated it with
  # a Mach-O instead. SvelteKit also runs on the host (`pnpm dev`),
  # mirroring CI (which runs `pnpm dev` on the GHA runner, not in a
  # container). docker-compose exists only to back Postgres.
  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      # postgres:18+ stores data under /var/lib/postgresql/<major>/docker/,
      # not /var/lib/postgresql/data as 17 and earlier did. Mount the
      # parent directory so the image's own layout logic owns the
      # version-specific subdir — this is also what the postgres image
      # docs recommend for pg_upgrade --link to work across majors later.
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
