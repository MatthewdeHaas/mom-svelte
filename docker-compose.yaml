services:
  # Rust API — see admin-operations-rust/README.md.
  # Build context is the repo root so the Dockerfile can COPY the
  # canonical `scripts/migrations/` directory into the crate.
  #
  # SvelteKit runs on the host via `pnpm dev`, mirroring CI (which also
  # runs `pnpm dev` on the GHA runner, not in a container). The former
  # `web` container has been removed — docker-compose exists only to
  # back the Rust API + Postgres, so local and CI shapes match.
  rust-api:
    build:
      context: .
      dockerfile: admin-operations-rust/Dockerfile
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      INTERNAL_AUTH_SECRET: ${INTERNAL_AUTH_SECRET}
      PORT: 8080
      RUST_LOG: info,sqlx::query=warn
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      # postgres:18+ stores data under /var/lib/postgresql/<major>/docker/,
      # not /var/lib/postgresql/data as 17 and earlier did. Mount the
      # parent directory so the image's own layout logic owns the
      # version-specific subdir — this is also what the postgres image
      # docs recommend for pg_upgrade --link to work across majors later.
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
